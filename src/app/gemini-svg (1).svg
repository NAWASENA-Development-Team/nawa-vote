<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <filter id="arcane-vote-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <g transform="translate(0, 0)">
    <polygon 
      points="60,40 75,60 60,80 45,60" 
      fill="#FFFFFF" 
      filter="url(#arcane-vote-glow)" 
    />

    <g fill="rgba(255, 255, 255, 0.75)">
      <polygon points="60,28 66,10 60,15 54,10" />
      <polygon points="60,92 66,110 60,105 54,110" />
      <polygon points="28,60 10,54 15,60 10,66" />
      <polygon points="92,60 110,54 105,60 110,66" />
    </g>

    <g fill="rgba(255, 255, 255, 0.40)">
      <circle cx="25" cy="25" r="5" />
      <circle cx="95" cy="25" r="5" />
      <circle cx="25" cy="95" r="5" />
      <circle cx="95" cy="95" r="5" />
    </g>
  </g>
</svg>
